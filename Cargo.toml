[package]
name = "massive"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Async Rust client for the Massive.com (formerly Polygon.io) REST and WebSocket API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/massive-rs"
keywords = ["massive", "polygon", "finance", "stocks", "api"]
categories = ["api-bindings", "finance", "web-programming"]
rust-version = "1.75"

[dependencies]
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[features]
default = ["reqwest/rustls-tls"]
